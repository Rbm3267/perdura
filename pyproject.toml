[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perdura"
version = "0.2.0"
description = "The mind that outlives its models — a persistent knowledge graph with ephemeral LLM workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
server = ["fastmcp>=2.0"]
retrieval = ["chromadb>=1.0"]
enterprise = ["psycopg[binary]>=3.1", "psycopg_pool>=3.1", "pyjwt[crypto]>=2.8"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
perdura = "perdura:main"

[project.urls]
Repository = "https://github.com/Rbm3267/perdura"

[tool.setuptools]
py-modules = ["perdura", "perdura_memoric", "perdura_retrieval", "perdura_viz",
              "perdura_track", "perdura_station", "perdura_store",
              "perdura_router", "perdura_service", "perdura_sso",
              "perdura_ingest", "perdura_connectors"]
