name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # E2 (multi-tenant) needs a real Postgres to exercise the RLS isolation
    # and advisory-lock tests for real rather than skipping; the default
    # credentials below match tests/test_postgres_store.py's and
    # tests/test_service_e2.py's PERDURA_TEST_PG_DSN fallback, so no extra
    # env var is needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is offline-by-default: workers import their SDKs lazily
      # and Postgres-dependent tests skip cleanly without one, but CI runs
      # a real Postgres service above so the E2 tests run for real here.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e ".[enterprise]"
      - name: Run tests
        run: python -m pytest -q
