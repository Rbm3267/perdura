name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is offline by design: workers import their SDKs lazily,
      # so the invariant tests need only pytest — no API keys, no model
      # server, no anthropic/google/openai install.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
